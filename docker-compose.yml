services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-tenant-saas-local
    container_name: multi-tenant-saas
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GF_GCFG_PATH: /app/config
      GF_GCFG_FILE: config.yaml
      NO_PROXY: "localhost,127.0.0.1,::1,10.0.0.0/8,10.*,172.16.0.0/12,172.16.*,192.168.0.0/16,192.168.*,host.internal,host.docker.internal"
      no_proxy: "localhost,127.0.0.1,::1,10.0.0.0/8,10.*,172.16.0.0/12,172.16.*,192.168.0.0/16,192.168.*,host.internal,host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:8000"

  postgres:
    image: postgres:16-alpine
    container_name: multi-tenant-saas-postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: saas_template
      POSTGRES_USER: saas_template
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_template -d saas_template"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: multi-tenant-saas-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
