server:
  env:         "local"
  address:     ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level : "all"
  stdout: true

# Authentication. devHeader is local/test only. API keys are stored as HMAC-SHA256(raw_key, secret).
auth:
  devHeader:
    enabled: true
  apiKey:
    secret: "repomind-local-dev-secret-change-me"
  password:
    enabled: true
    registrationEnabled: false
    minLength: 15
    bcryptCost: 12
  session:
    secret: "repomind-local-session-secret-change-me"
    absoluteTTL: "168h"
    idleTTL: "12h"
    cookie:
      name: "repomind_session"
      csrfName: "repomind_csrf"
      path: "/"

# AutoMigrate has only one switch. Database connection is read from database.default.
automigrate:
  enabled: true

web:
  # Used to generate invitation accept links when email delivery is not configured.
  baseUrl: "http://127.0.0.1:5173"

tenant:
  lifecycle:
    # Soft-deleted tenants are eligible for physical purge after this delay.
    purgeDelayHours: 720

database:
  default:
    # Format: pgsql:<user>:<password>@tcp(<host>:<port>)/<database>
    link: "pgsql:repomind:secret@tcp(127.0.0.1:55432)/repomind"
    debug: false
    charset: "utf8"
    dryRun: false
    maxIdle: 10
    maxOpen: 50
    maxLifetime: "30m"
