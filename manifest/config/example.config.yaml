# Minimal bootstrap config — only what is needed before DB/Redis are available.
# All other settings are stored in the system_config database table.
#
# Copy this file to config.yaml and customize for your environment.

server:
  env:         "local"
  address:     ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level : "all"
  stdout: true

# AES-256-GCM encryption key for sensitive config values (secrets).
# Must be exactly 32 bytes. Change in production!
encryptionKey: "change-me-to-a-32-byte-key-now!!"

# Redis connection for config caching.
redis:
  default:
    address:          "127.0.0.1:6379"
    db:               0
    pass:             ""
    maxIdle:          10
    maxActive:        100
    idleTimeout:      "60s"
    maxConnLifetime:  "60s"
    dialTimeout:      "5s"
    readTimeout:      "3s"
    writeTimeout:     "3s"

# Database connection. GoFrame uses this for all DB operations.
database:
  default:
    link: "pgsql:saas_template:secret@tcp(127.0.0.1:55432)/saas_template"
    debug: false
    charset: "utf8"
    dryRun: false
    maxIdle: 10
    maxOpen: 50
    maxLifetime: "30m"
