apiVersion: v1
kind: ConfigMap
metadata:
  name: template-single-configmap
data:
  config.yaml: |
    server:
      address:     ":8000"
      openapiPath: "/api.json"
      swaggerPath: "/swagger"

    logger:
      level : "all"
      stdout: true

    automigrate:
      enabled: true

    database:
      default:
        link: "pgsql:saas_template:secret@tcp(repomind-postgres:5432)/saas_template"
        debug: false
        charset: "utf8"
        dryRun: false
        maxIdle: 10
        maxOpen: 50
        maxLifetime: "30m"
