# Docker bootstrap config — only what is needed before DB/Redis are available.
# All other settings are stored in the system_config database table.

server:
  env: "local"
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

encryptionKey: "docker-dev-32-byte-encryption-key!!"

redis:
  default:
    address:          "redis:6379"
    db:               0
    pass:             ""
    maxIdle:          10
    maxActive:        100
    idleTimeout:      "60s"
    maxConnLifetime:  "60s"
    dialTimeout:      "5s"
    readTimeout:      "3s"
    writeTimeout:     "3s"

database:
  default:
    link: "pgsql:saas_template:secret@tcp(postgres:5432)/saas_template"
    debug: false
    charset: "utf8"
    dryRun: false
    maxIdle: 10
    maxOpen: 50
    maxLifetime: "30m"
